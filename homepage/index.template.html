<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Shawlaw 的个人主页，收录开源项目、开发记录和技术文章。">
  <title>Shawlaw · 开源作品与开发笔记</title>
  <link rel="icon" href="./favicon.ico">
  <style>:root {
  font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  --bg:#f8f8f0; --ink:#182923; --muted:#4e6056; --line:#d9e0d4;
  --accent:#285843; --surface:#fdfdf7; --chip:#edf2e8; --shadow:rgba(29,55,39,.08);
  --button:#1e4c38; --button-ink:#fff; --max:1120px;
  margin:0; color:var(--ink); background:var(--bg); font-size:15px; line-height:1.55;
}
a { color:inherit; text-decoration:none; }
a:hover { text-decoration:underline; text-underline-offset:.22em; }
button { font:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible { outline:2px solid currentColor; outline-offset:5px; }
h1,h2,h3,p,figure { margin:0; }
ul,ol { margin:0; padding:0; list-style:none; }
img { display:block; max-width:100%; }
[hidden] { display:none!important; }
section[id] { scroll-margin-top:24px; }
.wrap { width:min(calc(100% - 80px),var(--max)); margin-inline:auto; }

.site-header {
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  min-height:83px; border-bottom:1px solid var(--line);
}
.brand { display:inline-flex; align-items:center; gap:10px; font-size:23px; font-weight:800; letter-spacing:-.055em; white-space:nowrap; }
.site-header nav { display:flex; align-items:center; gap:clamp(14px,3.4vw,38px); font-size:14px; color:var(--muted); }
.site-header nav a { white-space:nowrap; }
.hero { display:grid; align-items:center; }
.hero h1 { font-weight:800; letter-spacing:-.055em; line-height:1.08; }
.hero-name { font-weight:650; color:var(--accent); font-size:16px; margin-bottom:13px; }
.intro { color:var(--muted); font-size:16px; line-height:1.85; max-width:475px; margin-top:21px; }
.actions { display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-top:25px; }
.social-links { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-top:14px; color:var(--muted); font-size:13px; }
.social-links a { color:var(--accent); white-space:nowrap; }
.primary {
  display:inline-flex; gap:13px; align-items:center; width:max-content; max-width:100%; min-height:43px; padding:9px 15px;
  border-radius:7px; color:var(--button-ink); background:var(--button); font-size:14px; font-weight:700;
}
.primary:hover { filter:brightness(1.12); text-decoration:none; }
.text-link { font-size:13px; font-weight:700; }
.text-link span, .section-title a span, .footer-links a span { margin-left:.25em; }
.avatar { object-fit:cover; border-radius:100%; }

.hero-a { grid-template-columns:minmax(0,1.45fr) minmax(250px,.75fr); gap:48px; padding:58px 0 61px; }
.hero-a h1 { font-size:clamp(46px,5.8vw,80px); }
.hero-a .intro { max-width:470px; }
.portrait { transform:rotate(3deg); width:min(100%,328px); justify-self:center; background:#fffef8; padding:12px; border:1px solid #dbe2d2; border-radius:12px; box-shadow:0 16px 32px var(--shadow); }
.portrait-grid {
  position:relative; display:grid; place-items:center; min-height:208px; overflow:hidden;
  background:linear-gradient(#6f8e6d25 1px,transparent 1px),linear-gradient(90deg,#6f8e6d25 1px,transparent 1px),#e5ead7;
  background-size:19px 19px; border-radius:6px;
}
.portrait-grid::before, .portrait-grid::after {
  content:""; position:absolute; width:151px; height:151px; border:1px solid #54734e63; border-radius:50%;
}
.portrait-grid::after { width:176px; height:176px; border-style:dashed; border-color:#54734e50; }
.portrait .avatar { position:relative; z-index:1; outline:4px solid #f7f8ea; outline-offset:0; box-shadow:0 4px 17px #46624744; }
.portrait-corner { position:absolute; width:19px; height:19px; border:1px solid #70916c; }
.portrait-corner.first { top:14px; left:14px; border-right:0; border-bottom:0; }
.portrait-corner.last { bottom:14px; right:14px; border-left:0; border-top:0; }
.portrait figcaption { display:flex; justify-content:space-between; align-items:center; padding:12px 4px 2px; gap:5px; }
.portrait figcaption strong { font-size:18px; letter-spacing:-.04em; }
.portrait figcaption span { color:var(--muted); font-size:11px; white-space:nowrap; }

.section { margin:0 0 51px; min-width:0; }
.section-title {
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; min-height:45px;
  border-bottom:1px solid var(--line);
}
.section-title h2 { font-size:clamp(26px,3.1vw,39px); line-height:1.28; font-weight:800; letter-spacing:-.05em; }
.section-title > a { color:var(--muted); text-align:right; }
.feature-grid, .other-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; margin-top:13px; }
.project-card { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.project-copy { padding:19px 20px; }
.project-head, .compact-head { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:11px; }
.project-icon { display:grid; place-items:center; border-radius:10px; background:var(--chip); color:var(--accent); width:45px; height:45px; flex-shrink:0; }
.project-icon img { width:32px; height:32px; object-fit:contain; }
.glyph { font-family:"IBM Plex Mono",monospace; font-weight:750; font-size:21px; }
.project-card h3, .compact-projects h3 { font-size:20px; line-height:1.25; letter-spacing:-.04em; overflow-wrap:anywhere; }
.project-label { color:var(--muted); font-size:12px; margin-top:2px; }
.project-desc { color:var(--muted); font-size:14px; line-height:1.65; margin:12px 0 8px; }
.version { align-self:start; display:inline-flex; align-items:center; gap:3px; white-space:nowrap; background:var(--chip); color:var(--accent); border-radius:5px; padding:4px 6px; font:650 11px/1.3 "IBM Plex Mono",monospace; }
.subhead { margin-top:25px; }
.subhead h3 { font-size:17px; letter-spacing:-.02em; }
.other-grid { margin-top:9px; }

.archive-grid { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); align-items:start; gap:42px; }
.timeline li, .article-list li { border-bottom:1px solid var(--line); }
.timeline li { display:grid; grid-template-columns:88px minmax(0,1fr); gap:9px; padding:12px 0; }
.timeline time, .article-list time, .article-topic { color:var(--muted); font-size:12px; white-space:nowrap; }
.timeline time, .article-list time { font-family:"IBM Plex Mono",monospace; }
.timeline time { padding-top:3px; }
.timeline h3 { font-size:15px; font-weight:750; }
.timeline h3 span, .article-list a span { font-size:12px; margin-left:.23em; color:var(--muted); }
.timeline p { color:var(--muted); font-size:12px; margin-top:2px; }
.article-filters { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:5px; }
.article-filters button { color:var(--muted); background:transparent; padding:5px 9px; min-height:33px; border:1px solid var(--line); border-radius:5px; font-size:12px; }
.article-filters button[aria-pressed="true"] { color:var(--accent); background:var(--chip); border-color:var(--accent); font-weight:700; }
.article-list li { display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:10px 0; font-size:14px; }
.article-list li a { overflow-wrap:anywhere; }
.site-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:20px 0 30px; border-top:1px solid var(--line); }
.site-footer strong { font-size:19px; letter-spacing:-.04em; }
.site-footer p, .site-footer small { color:var(--muted); font-size:12px; }
.footer-links { display:flex; flex-wrap:wrap; gap:16px; font-size:13px; }

.brand-avatar { width:30px; height:30px; border:1px solid #c8d5c5; background:#fff; }
.portrait figcaption .text-link { font-size:12px; color:var(--accent); }
.studio-strip {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:16px;
  padding:15px 18px; border:1px solid #cad9c9; border-radius:10px; background:#e8eee2;
}
.studio-mark { width:47px; height:47px; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:8px; background:#224b3b; border-radius:11px; }
.studio-mark i { background:#d7ebc9; border-radius:4px; }
.studio-mark i:nth-child(2) { background:#8db48b; border-radius:50%; }
.studio-mark i:nth-child(3) { background:#8db48b; }
.studio-mark i:nth-child(4) { transform:scale(.8) rotate(16deg); }
.studio-copy h3 { font-size:23px; letter-spacing:-.055em; line-height:1.2; }
.studio-copy p { font-size:13px; color:var(--muted); margin-top:2px; }
.tool-links { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:5px; }
.tool-links li { display:flex; align-items:baseline; gap:5px; font-size:12px; }
.tool-version { color:var(--muted); font:11px "IBM Plex Mono",monospace; }
.studio-actions { display:flex; align-items:center; gap:13px; }
.studio-actions .primary { min-height:39px; padding:7px 10px; gap:8px; font-size:13px; }
.studio-actions .text-link { white-space:nowrap; }
.product-shot { position:relative; display:flex; justify-content:center; align-items:flex-start; overflow:hidden; aspect-ratio:2.04; padding:19px 20px 0; border-bottom:1px solid var(--line); }
.product-shot-quota { background:linear-gradient(140deg,#dbe6d7,#b6cec1); }
.product-shot-logcat { background:linear-gradient(140deg,#e1e9e9,#bfd3d6); }
.product-shot img { width:100%; height:auto; border-radius:8px 8px 0 0; box-shadow:0 9px 23px #31483c37; }
.product-shot figcaption { position:absolute; right:9px; bottom:9px; background:#fdfdf7; color:#28493d; border:1px solid #c5d3c6; border-radius:4px; padding:3px 6px; font-size:10px; }
.feature-grid .project-copy { padding:17px 20px 20px; }

@media (max-width:900px) {
  .wrap { width:calc(100% - 52px); }
  .hero-a { gap:32px; }
  .archive-grid { gap:26px; }
}
@media (max-width:660px) {
  .wrap { width:calc(100% - 34px); }
  .site-header { min-height:62px; gap:7px; }
  .site-header nav { gap:10px; font-size:12px; }
  .brand { font-size:19px; gap:6px; }
  .brand-avatar { width:24px; height:24px; }
  .hero-a { display:block; padding:32px 0 29px; }
  .hero-a h1 { font-size:clamp(36px,9.55vw,58px); }
  .hero-a .intro { max-width:100%; }
  .portrait { display:none; }
  .intro { font-size:14px; margin-top:15px; }
  .actions { margin-top:18px; }
  .hero-name { font-size:14px; margin-bottom:9px; }
  .section { margin-bottom:34px; }
  .section-title { min-height:38px; margin-bottom:10px; }
  .section-title > a { font-size:11px; }
  .studio-strip { grid-template-columns:auto minmax(0,1fr); gap:9px 11px; padding:12px 12px 13px; align-items:start; }
  .studio-mark { width:36px; height:36px; padding:6px; }
  .studio-copy h3 { font-size:20px; }
  .studio-copy p { font-size:12px; }
  .studio-actions { grid-column:2; gap:12px; }
  .studio-actions .primary { min-height:36px; padding:6px 9px; }
  .tool-links { gap:3px 9px; }
  .tool-links li { font-size:11px; }
  .tool-version { font-size:10px; }
  .feature-grid,.other-grid,.archive-grid { grid-template-columns:minmax(0,1fr); gap:10px; }
  .archive-grid { gap:0; }
  .product-shot { padding:13px 14px 0; aspect-ratio:1.85; }
  .project-copy, .feature-grid .project-copy { padding:15px 13px; }
  .project-card h3 { font-size:18px; }
  .site-footer { padding:16px 0 21px; }
}
@media (max-width:370px) {
  .wrap { width:calc(100% - 24px); }
  .site-header nav { gap:6px; font-size:11px; }
  .brand { font-size:16px; gap:4px; }
  .brand-avatar { width:22px; height:22px; }
}
</style>
</head>
<body id="top">
  <header class="site-header wrap">
    <a class="brand" href="#top" aria-label="Shawlaw 首页"><img class="avatar brand-avatar" src="@@AVATAR@@" alt="" width="30" height="30"> Shawlaw</a>
    <nav aria-label="站内导航">
      <a href="#projects">项目</a><a href="#activity">记录</a><a href="#articles">文章</a><a href="#about">关于</a>
    </nav>
  </header>
  <main class="wrap">
    <section id="about" class="hero hero-a">
      <div class="hero-copy">
        <p class="hero-name">你好，我是 Shawlaw</p>
        <h1>为日常需求，<br>做趁手的工具</h1>
        <p class="intro">我是一名开发者，熟悉 Android 开发，做过桌面应用和 Web 工具，也在探索后端开发。这里收录了我的开源项目和开发笔记。</p>
        <div class="actions"><a class="primary" href="#projects">浏览作品 <span aria-hidden="true">→</span></a><a class="text-link" href="https://github.com/Shawlaw" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></div>
        <p class="social-links">
          <span>更多生活日常</span>
          <a class="text-link" href="https://weibo.com/ShawlawLeo" target="_blank" rel="noopener noreferrer">微博 <span aria-hidden="true">↗</span></a>
          <a class="text-link" href="https://xhslink.cn/o/18HdX4pXtCw" target="_blank" rel="noopener noreferrer">小红书 <span aria-hidden="true">↗</span></a>
          <a class="text-link" href="https://space.bilibili.com/5065291" target="_blank" rel="noopener noreferrer">B 站 <span aria-hidden="true">↗</span></a>
        </p>
      </div>
      <figure class="portrait">
        <div class="portrait-grid"><span class="portrait-corner first" aria-hidden="true"></span><span class="portrait-corner last" aria-hidden="true"></span>
        <img class="avatar" src="@@AVATAR@@" alt="" width="112" height="112"></div>
        <figcaption><strong>Shawlaw</strong><a class="text-link" href="https://github.com/Shawlaw" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></figcaption>
      </figure>
    </section>
    <section id="projects" class="section">
      <div class="section-title"><h2>开源作品</h2><a class="text-link" href="https://github.com/Shawlaw?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub 仓库 <span aria-hidden="true">↗</span></a></div>@@PROJECTS@@
    </section>
    <div class="archive-grid">
      <section id="activity" class="section">
        <div class="section-title"><h2>开发记录</h2></div>
        <ol class="timeline">@@TIMELINE@@</ol>
      </section>
      <section id="articles" class="section">
        <div class="section-title"><h2>历史文章</h2></div>
        <div class="article-filters" role="group" aria-label="按主题筛选文章" hidden><button type="button" data-category="全部" aria-pressed="true">全部</button><button type="button" data-category="Android" aria-pressed="false">Android</button><button type="button" data-category="Git" aria-pressed="false">Git</button><button type="button" data-category="工程实践" aria-pressed="false">工程实践</button></div>
        <ul class="article-list">@@ARTICLES@@</ul>
      </section>
    </div>
  </main>
  <footer class="site-footer wrap">
    <div><strong>Shawlaw</strong><p>开源项目与开发笔记</p></div>
    <div class="footer-links"><a class="" href="https://github.com/Shawlaw" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a><a class="" href="https://github.com/Shawlaw/Shawlaw.GitHub.Io" target="_blank" rel="noopener noreferrer">本站源码 <span aria-hidden="true">↗</span></a></div>
    <small>版本快照 · @@SYNC_DATE@@</small>
  </footer>
  <script>
    const filters = document.querySelector('.article-filters');
    const buttons = [...filters.querySelectorAll('[data-category]')];
    const entries = [...document.querySelectorAll('[data-topic]')];
    filters.hidden = false;
    filters.addEventListener('click', event => {
      const selected = event.target.closest('button[data-category]');
      if (!selected) return;
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button === selected)));
      entries.forEach(entry => {
        entry.hidden = selected.dataset.category !== '全部' && selected.dataset.category !== entry.dataset.topic;
      });
    });
  </script>
</body>
</html>
